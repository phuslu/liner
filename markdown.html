

<!-- markdown for nginx, see https://phus.lu -->
<script>
!function(){
	var dom = {
		element: null,
		get: function (o) {
			var obj = Object.create(this)
			obj.element = (typeof o == "object") ? o : document.createElement(o)
			return obj
		},
		add: function (o) {
			var obj = dom.get(o)
			this.element.appendChild(obj.element)
			return obj
		},
		text: function (t) {
			this.element.appendChild(document.createTextNode(t))
			return this
		},
		attr: function (k, v) {
			this.element.setAttribute(k, v)
			return this
		}
	}

	if (!document.head) return
	head = dom.get(document.head)
	head.add('meta').attr('charset', 'utf-8')
	head.add('meta').attr('name', 'viewport').attr('content', 'width=device-width,initial-scale=1')

	if (!document.body) {
		document.write(["<div class=\"container\">",
		"<h3>nginx.conf</h3>",
		"<textarea rows=6 cols=50>",
		"# download markdown.html to /wwwroot",
		"location ~ \\.md$ {",
		"    default_type text/html;",
		"    add_after_body /markdown.html;",
		"}",
		"</textarea>",
		"</div>"].join("\n"))
		return
	}

	var bodytext = ''
	var serializedBody = document.body.innerHTML
	var markerIndex = serializedBody.indexOf('<!-- markdown for nginx')
	if (markerIndex >= 0) {
		var textareaEnd = '__MARKDOWN_TEXTAREA_END__'
		var textarea = document.createElement('textarea')
		textarea.innerHTML = serializedBody.slice(0, markerIndex).replace(/<\/textarea/gi, textareaEnd)
		bodytext = textarea.value.split(textareaEnd).join('</textarea>')
	} else {
		for (node = document.body.firstChild; node; node = node.nextSibling) {
			if (node.nodeType == 8 && /markdown for nginx/.test(node.textContent)) break
			bodytext += node.nodeType == 8 ? '<!--' + node.textContent + '-->' : (node.nodeType == 1 ? node.outerHTML : node.textContent)
		}
	}
	document.documentElement.style.visibility = 'hidden'
	var domReady = document.readyState == 'loading' ? new Promise(function(resolve) {
		document.addEventListener('DOMContentLoaded', resolve, {once: true})
	}) : Promise.resolve()

	var language = navigator.languages && navigator.languages[0] || navigator.language || ''
	var chinese = /^zh(?:-|$)/i.test(language)
	var labels = chinese ? {
		copy: '复制 Markdown 原文',
		copyText: '复制',
		copied: 'Markdown 原文已复制',
		failed: '复制失败，请重试',
		download: '下载 Markdown 原文',
		downloadText: '下载',
		actions: 'Markdown 操作'
	} : {
		copy: 'Copy Markdown',
		copyText: 'Copy',
		copied: 'Markdown source copied',
		failed: 'Copy failed. Try again.',
		download: 'Download Markdown',
		downloadText: 'Download',
		actions: 'Markdown actions'
	}
	document.documentElement.lang = language

	title = decodeURIComponent(document.location.pathname.replace(/.*\//, '').replace(/\.html$/, ''))
	document.title = '《' + title.replace(/\.md$/i, '') + '》'

	div = dom.get('div').attr('class', 'container')
	header = div.add('header').attr('class', 'page-header')
	header.add('h1').attr('class', 'page-title octicon-book').text(title.replace(/\.md$/i, ''))
	pane = div.add('div').attr('class', 'document-pane')
	article = pane.add('main').attr('id', 'readme').attr('class', 'markdown-body')
	actions = pane.add('div').attr('class', 'document-actions')
	copyButton = actions.add('button').attr('type', 'button').attr('class', 'document-action copy-markdown').attr('aria-label', labels.actions).attr('aria-haspopup', 'menu').attr('aria-expanded', 'false').attr('aria-controls', 'document-action-menu')
	menu = actions.add('div').attr('class', 'document-menu').attr('id', 'document-action-menu').attr('role', 'menu').attr('aria-label', labels.actions)
	copyItem = menu.add('button').attr('type', 'button').attr('class', 'document-menu-item copy-markdown').attr('role', 'menuitem').attr('aria-label', labels.copy).text(labels.copyText)
	downloadItem = menu.add('button').attr('type', 'button').attr('class', 'document-menu-item download-markdown').attr('role', 'menuitem').attr('aria-label', labels.download).text(labels.downloadText)

	var copied = function(ok) {
		copyButton.element.classList.toggle('is-copied', ok)
		copyButton.element.classList.toggle('is-error', !ok)
		copyButton.element.setAttribute('aria-label', ok ? labels.copied : labels.failed)
		window.setTimeout(function() {
			copyButton.element.classList.remove('is-copied', 'is-error')
			copyButton.element.setAttribute('aria-label', labels.actions)
		}, 1600)
	}
	var fallbackCopy = function() {
		var textarea = document.createElement('textarea')
		textarea.value = bodytext
		textarea.style.cssText = 'position:fixed;opacity:0'
		document.body.appendChild(textarea)
		textarea.select()
		var ok = document.execCommand('copy')
		textarea.remove()
		copied(ok)
	}
	var copyMarkdown = function() {
		if (navigator.clipboard && window.isSecureContext) {
			navigator.clipboard.writeText(bodytext).then(function() {
				copied(true)
			}, fallbackCopy)
		} else {
			fallbackCopy()
		}
	}
	var downloadMarkdown = function() {
		var url = URL.createObjectURL(new Blob([bodytext], {type: 'text/markdown;charset=utf-8'}))
		var link = document.createElement('a')
		link.href = url
		link.download = title.replace(/\.md$/i, '') + '.md'
		document.body.appendChild(link)
		link.click()
		link.remove()
		window.setTimeout(function() {
			URL.revokeObjectURL(url)
		}, 1000)
	}

	var menuIsOpen = function() {
		return actions.element.classList.contains('is-open')
	}
	var closeMenu = function(returnFocus) {
		actions.element.classList.remove('is-open')
		copyButton.element.setAttribute('aria-expanded', 'false')
		if (returnFocus) copyButton.element.focus()
	}
	var openMenu = function(focusItem) {
		actions.element.classList.add('is-open')
		copyButton.element.setAttribute('aria-expanded', 'true')
		if (focusItem) copyItem.element.focus()
	}
	copyButton.element.onclick = function() {
		if (menuIsOpen()) closeMenu(false)
		else openMenu(true)
	}
	copyItem.element.onclick = function() {
		closeMenu(true)
		copyMarkdown()
	}
	downloadItem.element.onclick = function() {
		closeMenu(true)
		downloadMarkdown()
	}
	actions.element.addEventListener('keydown', function(event) {
		var items = [copyItem.element, downloadItem.element]
		var index = items.indexOf(document.activeElement)
		if (event.key === 'Escape' && menuIsOpen()) {
			event.preventDefault()
			closeMenu(true)
		} else if (event.key === 'ArrowDown' && menuIsOpen()) {
			event.preventDefault()
			items[(index + 1) % items.length].focus()
		} else if (event.key === 'ArrowUp' && menuIsOpen()) {
			event.preventDefault()
			items[index <= 0 ? items.length - 1 : index - 1].focus()
		} else if (event.key === 'Home' && menuIsOpen()) {
			event.preventDefault()
			items[0].focus()
		} else if (event.key === 'End' && menuIsOpen()) {
			event.preventDefault()
			items[items.length - 1].focus()
		} else if (event.key === 'ArrowDown' && event.target === copyButton.element) {
			event.preventDefault()
			openMenu(true)
		} else if (event.key === 'ArrowUp' && event.target === copyButton.element) {
			event.preventDefault()
			openMenu(false)
			downloadItem.element.focus()
		}
	})
	actions.element.addEventListener('focusout', function(event) {
		if (menuIsOpen() && !actions.element.contains(event.relatedTarget)) closeMenu(false)
	})
	document.addEventListener('pointerdown', function(event) {
		if (menuIsOpen() && !actions.element.contains(event.target)) closeMenu(false)
	})

	var resources = Object.create(null)
	var loadScript = function(name, src, integrity) {
		if (resources[name]) return resources[name]
		resources[name] = new Promise(function(resolve, reject) {
			var script = document.createElement('script')
			script.src = src
			script.integrity = integrity
			script.crossOrigin = 'anonymous'
			script.onload = resolve
			script.onerror = reject
			document.head.appendChild(script)
		})
		return resources[name]
	}
	var loadStyle = function(name, href, integrity, media) {
		if (resources[name]) return resources[name]
		resources[name] = new Promise(function(resolve, reject) {
			var link = document.createElement('link')
			link.rel = 'stylesheet'
			link.href = href
			link.integrity = integrity
			link.crossOrigin = 'anonymous'
			if (media) link.media = media
			link.onload = resolve
			link.onerror = reject
			document.head.appendChild(link)
		})
		return resources[name]
	}
	var highlightCode = function(blocks) {
		loadStyle('highlight-light-style', 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github.min.css', 'sha512-0aPQyyeZrWj9sCA46UlmWgKOP0mUipLQ6OZXu8l4IcAmD2u31EPEy9VcIMvl7SoAaKe8bLXZhYoMaE/in+gcgA==', '(prefers-color-scheme: light)').catch(function() {})
		loadStyle('highlight-dark-style', 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github-dark.min.css', 'sha512-rO+olRTkcf304DQBxSWxln8JXCzTHlKnIdnMUwYvQa9/Jd4cQaNkItIUj6Z4nvW1dqK0SKXLbn9h4KwZTNtAyw==', '(prefers-color-scheme: dark)').catch(function() {})
		loadScript('highlight', 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js', 'sha512-gzqHAlI1hVdzJ4wiQj/MkppDr6zgEdCoBsrXKRidcaZsSPvNQ3Fy5p7PpMt/8mltxTxMHj1Ur5NWbJdqIfpxgA==').then(function() {
			blocks.forEach(function(code) {
				var language = (code.className.match(/(?:^|\s)language-([^\s]+)/) || [])[1]
				if (language && window.hljs.getLanguage(language.toLowerCase())) {
					window.hljs.highlightElement(code)
				}
			})
		}).catch(function() {})
	}
	var mermaidNodes = []
	var prefersDark = function() {
		return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
	}
	var markMermaidError = function(node) {
		node.textContent = node.dataset.source
		node.classList.add('mermaid-error')
	}
	var validateMermaid = function(nodes) {
		var renderable = []
		var queue = Promise.resolve()
		nodes.forEach(function(node) {
			queue = queue.then(function() {
				return window.mermaid.parse(node.dataset.source, {suppressErrors: true})
			}).then(function(valid) {
				if (valid) renderable.push(node)
				else markMermaidError(node)
			}, function() {
				markMermaidError(node)
			})
		})
		return queue.then(function() {
			return renderable
		})
	}
	var runMermaid = function(nodes) {
		nodes.forEach(function(node) {
			node.classList.remove('mermaid-error')
			node.removeAttribute('data-processed')
			node.textContent = node.dataset.source
		})
		window.mermaid.initialize({
			startOnLoad: false,
			securityLevel: 'strict',
			theme: prefersDark() ? 'dark' : 'default'
		})
		return validateMermaid(nodes).then(function(renderable) {
			if (!renderable.length) return
			return window.mermaid.run({nodes: renderable}).catch(function() {
				renderable.forEach(function(node) {
					if (!node.querySelector('svg')) markMermaidError(node)
				})
			})
		})
	}
	var renderMermaid = function(blocks) {
		loadScript('mermaid', 'https://cdn.jsdelivr.net/npm/@mermaid-js/tiny@12.2.0/dist/mermaid.tiny.js', 'sha512-Z5xCRPlSOr6dAxUueJ1trNZh66IvMoMvN/dxy5cK2xCjkPbOhSgBoNbtQbtzBmd+Yq4c+85qOyBHG9qSe/PE/g==').then(function() {
			mermaidNodes = blocks.map(function(code) {
				var source = code.textContent
				var node = document.createElement('div')
				node.className = 'mermaid'
				node.dataset.source = source
				node.textContent = source
				code.parentElement.replaceWith(node)
				return node
			})
			return runMermaid(mermaidNodes)
		}).catch(function() {})
		if (window.matchMedia) {
			var scheme = window.matchMedia('(prefers-color-scheme: dark)')
			var updateTheme = function() {
				if (window.mermaid && mermaidNodes.length) {
					runMermaid(mermaidNodes).catch(function() {})
				}
			}
			if (scheme.addEventListener) scheme.addEventListener('change', updateTheme)
			else if (scheme.addListener) scheme.addListener(updateTheme)
		}
	}
	var enhanceMarkdown = function() {
		var blocks = Array.prototype.slice.call(article.element.querySelectorAll('pre > code'))
		var diagrams = blocks.filter(function(code) {
			return code.classList.contains('language-mermaid')
		})
		var syntaxBlocks = blocks.filter(function(code) {
			return !code.classList.contains('language-mermaid')
		})
		if (syntaxBlocks.length) highlightCode(syntaxBlocks)
		if (diagrams.length) renderMermaid(diagrams)
	}

	div.add('link').attr('rel', 'stylesheet').attr('href', 'https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.9.0/github-markdown.min.css').attr('integrity', 'sha512-Ouq1+UcR9ENXndFyd/YA9i+ETLJmX3WoaMBF/nDzdqJbipKGL/SAbkO+qjDoxfD/dhZs4ZqgR9vXkolrK77xmQ==').attr('crossorigin', 'anonymous')
	var markedReady = loadScript('marked', 'https://cdnjs.cloudflare.com/ajax/libs/marked/18.1.1/lib/marked.umd.min.js', 'sha512-TR+1uszv8n9bFfC+4wouvHv2Na21prfppUEcxR62hf7+e4AZpz1l726rHEk5Zhpg6uJWUJ+LhN+hVqL99YCZqQ==')
	var mount = function() {
		var pageStyle = document.getElementById('markdown-theme')
		if (pageStyle) document.head.appendChild(pageStyle)
		document.body.innerHTML = ''
		document.body.appendChild(div.element)
		document.documentElement.style.visibility = ''
	}
	Promise.all([markedReady, domReady]).then(function() {
		mount()
		article.element.innerHTML = marked.parse(bodytext)
		enhanceMarkdown()
	}).catch(function() {
		mount()
		article.element.textContent = bodytext
		article.element.className += ' markdown-source'
	})
}()
</script>

<style id="markdown-theme">
:root {
	color-scheme: light dark;
	--page-bg: #f6f8fa;
	--page-fg: #1f2328;
	--page-muted: #59636e;
	--page-line: #d1d9e0;
	--page-link: #0969da;
	--page-control: #fff;
	--page-control-hover: #f6f8fa;
	--page-shadow: rgba(31, 35, 40, .08);
}
@media (prefers-color-scheme: dark) {
	:root {
		--page-bg: #010409;
		--page-fg: #f0f6fc;
		--page-muted: #9198a1;
		--page-line: #3d444d;
		--page-link: #4493f8;
		--page-control: #151b23;
		--page-control-hover: #1f2630;
		--page-shadow: rgba(1, 4, 9, .4);
	}
}
* {
	box-sizing: border-box;
}
body {
	min-height: 100vh;
	margin: 0;
	background: var(--page-bg);
	color: var(--page-fg);
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.container {
	width: min(100% - 32px, 900px);
	margin: 0 auto 48px;
}
.page-header {
	display: flex;
	align-items: center;
	padding: 28px clamp(20px, 6vw, 56px) 16px;
}
.page-title {
	display: flex;
	align-items: center;
	gap: 10px;
	min-width: 0;
	margin: 0;
	overflow: hidden;
	color: var(--page-fg);
	font-size: 17px;
	font-weight: 600;
	line-height: 1.4;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.octicon-book::before {
	width: 18px;
	height: 18px;
	flex: none;
	background: currentColor;
	content: "";
	-webkit-mask: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z'/%3E%3C/svg%3E") center / contain no-repeat;
	mask: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z'/%3E%3C/svg%3E") center / contain no-repeat;
}
.document-pane {
	position: relative;
}
.document-actions {
	position: absolute;
	top: 14px;
	right: 14px;
	opacity: 0;
	pointer-events: none;
	transform: translateY(-4px);
	transition: opacity .16s ease, transform .16s ease;
}
.document-pane:hover .document-actions,
.document-actions:focus-within {
	opacity: 1;
	pointer-events: auto;
	transform: none;
}
.document-action {
	position: relative;
	display: grid;
	width: 34px;
	height: 34px;
	padding: 0;
	place-items: center;
	color: var(--page-muted);
	background: var(--page-control);
	border: 1px solid var(--page-line);
	border-radius: 8px;
	box-shadow: 0 1px 3px var(--page-shadow);
	cursor: pointer;
	transition: transform .16s ease, color .16s ease, background-color .16s ease;
}
.document-action:hover {
	color: var(--page-fg);
	background: var(--page-control-hover);
}
.document-action:focus-visible {
	outline: 2px solid var(--page-link);
	outline-offset: 2px;
}
.document-action:active {
	transform: scale(.96);
}
.document-action::before {
	width: 16px;
	height: 16px;
	background: currentColor;
	content: "";
}
.document-action[aria-expanded="true"] {
	color: var(--page-fg);
	background: var(--page-control-hover);
}
.copy-markdown::before {
	-webkit-mask: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Zm5-5C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z'/%3E%3C/svg%3E") center / contain no-repeat;
	mask: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Zm5-5C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z'/%3E%3C/svg%3E") center / contain no-repeat;
}
