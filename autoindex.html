
<!-- autoindex.html 2026-10-24 for nginx, see https://phus.lu -->
<script>
!function(){
	website_title = ''
	max_name_length = 60
	enable_readme = true
	omit_icon_if_emoji = true
	datetime_format = '%d-%b-%Y %H:%M'

	var dom = {
		element: null,
		get: function (o) {
			var obj = Object.create(this)
			obj.element = (typeof o == "object") ? o : document.createElement(o)
			return obj
		},
		add: function (o) {
			var obj = dom.get(o)
			this.element.appendChild(obj.element)
			return obj
		},
		text: function (t) {
			this.element.appendChild(document.createTextNode(t))
			return this
		},
		html: function (s) {
			this.element.innerHTML = s
			return this
		},
		attr: function (k, v) {
			this.element.setAttribute(k, v)
			return this
		}
	}

	var specialchars = {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}
	var escape = function (s) {
		return String(s).replace(/[&<>"']/g, function (c) { return specialchars[c] })
	}

	head = dom.get(document.head)
	// head.add('link').attr('rel', 'manifest').attr('href', '/manifest.json')
	head.add('meta').attr('charset', 'utf-8')
	head.add('meta').attr('name', 'viewport').attr('content', 'width=device-width,initial-scale=1')

	if (!document.title) {
		document.write(["<div class=\"container\">",
		"<h3>nginx.conf</h3>",
		"<textarea rows=8 cols=50>",
		"# download autoindex.html to /wwwroot/",
		"location ~ ^(.*)/$ {",
		"    charset utf-8;",
		"    autoindex on;",
		"    autoindex_localtime on;",
		"    autoindex_exact_size off;",
		"    add_after_body /autoindex.html;",
		"}",
		"</textarea>",
		"</div>"].join("\n"))
		return
	}

	var bodylines = document.body.innerHTML.split('\n')
	document.body.innerHTML = ''

	titlehtml = document.title.replace(/\/$/, '').split('/').slice(1).reduce(function(acc, v, i, a) {
		return acc + '<a href="/' + a.slice(0, i+1).join('/') + '/">' + v + '</a>/'
	}, '<a href="/">Index</a> of /')
	if (website_title) {
		document.title = website_title + ' - ' + document.title
	}
	head.add('meta').attr('name', 'description').attr('content', document.title)

	div = dom.get('div').attr('class', 'container')
	div.add('table').add('tbody').add('tr').add('th').html(titlehtml)
	table = div.add('table').attr('class', 'table-hover').add('tbody')

	columns = ['Name', 'Date', 'Size']
	rows = ['<tr>']
	for (i = 0; i < columns.length; i++)
		rows.push('<td><a href="javascript:sortby('+i+')" class="octicon arrow-up">'+columns[i]+'</a></td>')
	rows.push('</tr>')

	var named_icons = {
		'license': 'law', 'licence': 'law', 'copying': 'law', 'notice': 'law', 'patents': 'law',
		'license.md': 'law', 'license.txt': 'law', 'copying.md': 'law', 'copying.txt': 'law',
		'readme': 'book', 'readme.md': 'book', 'readme.js': 'book', 'readme.txt': 'book',
		'changelog': 'book', 'changelog.md': 'book', 'changes': 'book', 'changes.md': 'book',
		'history': 'book', 'history.md': 'book', 'package.json': 'package',
		'package-lock.json': 'package', 'npm-shrinkwrap.json': 'package',
		'yarn.lock': 'package', 'pnpm-lock.yaml': 'package', 'bun.lock': 'package',
		'bun.lockb': 'package', 'cargo.lock': 'package', 'gemfile.lock': 'package',
		'composer.lock': 'package', 'dockerfile': 'file-code', 'makefile': 'file-code',
		'rakefile': 'file-code', 'gemfile': 'file-code', 'vagrantfile': 'file-code',
		'brewfile': 'file-code', 'procfile': 'file-code', 'justfile': 'file-code'
	}
	var icons = {
		'7z': 'file-zip', 'br': 'file-zip', 'bz2': 'file-zip', 'cab': 'file-zip',
		'gz': 'file-zip', 'lz': 'file-zip', 'lzma': 'file-zip', 'pack': 'file-zip',
		'rar': 'file-zip', 'tar': 'file-zip', 'tbz2': 'file-zip', 'tgz': 'file-zip',
		'xz': 'file-zip', 'z': 'file-zip', 'zip': 'file-zip', 'zst': 'file-zip',
		'asm': 'file-code', 'bash': 'file-code', 'bat': 'file-code', 'bf': 'file-code',
		'c': 'file-code', 'cc': 'file-code', 'clj': 'file-code', 'cljs': 'file-code',
		'cmd': 'file-code', 'cpp': 'file-code', 'cs': 'file-code', 'css': 'file-code',
		'cxx': 'file-code', 'dart': 'file-code', 'elm': 'file-code', 'erl': 'file-code',
		'ex': 'file-code', 'exs': 'file-code', 'fs': 'file-code', 'fsx': 'file-code',
		'go': 'file-code', 'h': 'file-code', 'hpp': 'file-code', 'hs': 'file-code',
		'java': 'file-code', 'jl': 'file-code', 'js': 'file-code', 'jsx': 'file-code',
		'kt': 'file-code', 'kts': 'file-code', 'less': 'file-code', 'lua': 'file-code',
		'm': 'file-code', 'mjs': 'file-code', 'nim': 'file-code', 'php': 'file-code',
		'pl': 'file-code', 'ps1': 'file-code', 'py': 'file-code', 'r': 'file-code',
		'rb': 'file-code', 'rs': 'file-code', 's': 'file-code', 'sass': 'file-code',
		'scala': 'file-code', 'scss': 'file-code', 'scm': 'file-code', 'sh': 'file-code',
		'svelte': 'file-code', 'swift': 'file-code', 'ts': 'file-code', 'tsx': 'file-code',
		'vbs': 'file-code', 'vue': 'file-code', 'zig': 'file-code',
		'htm': 'browser', 'html': 'browser',
		'babelrc': 'gear', 'bash_history': 'history', 'bashrc': 'gear', 'cfg': 'gear',
		'conf': 'gear', 'config': 'gear', 'desktop': 'gear', 'editorconfig': 'gear',
		'env': 'gear', 'gitattributes': 'gear', 'gitignore': 'gear', 'gitmodules': 'gear',
		'iceauthority': 'gear', 'ini': 'gear', 'jellyfin-config': 'gear',
		'jellyfin-root': 'gear', 'json': 'gear', 'jsonc': 'gear', 'mount': 'gear',
		'npmignore': 'gear', 'nvmrc': 'gear', 'profile': 'gear', 'properties': 'gear',
		'rc': 'gear', 'sample': 'gear', 'service': 'gear', 'sudo_as_admin_successful': 'gear',
		'terminal': 'gear', 'toml': 'gear', 'vimrc': 'gear', 'xresources': 'gear',
		'xml': 'gear', 'yaml': 'gear', 'yml': 'gear',
		'collection': 'table', 'csv': 'table', 'numbers': 'table', 'ods': 'table',
		'tsv': 'table', 'xls': 'table', 'xlsx': 'table',
		'accdb': 'database', 'db': 'database', 'db-journal': 'database', 'db-shm': 'database',
		'db-wal': 'database', 'hyb': 'database', 'idx': 'database', 'jellyfin-data': 'database',
		'journal': 'database', 'ldb': 'database', 'mdb': 'database', 'mmdb': 'database',
		'old-shm': 'database', 'old-wal': 'database', 'parquet': 'database', 'sql': 'database',
		'sqlite': 'database', 'sqlite3': 'database', 'tdb': 'database',
		'avif': 'image', 'bmp': 'image', 'gif': 'image', 'heic': 'image', 'heif': 'image',
		'ico': 'image', 'jfif': 'image', 'jpeg': 'image', 'jpg': 'image', 'jxl': 'image',
		'png': 'image', 'psd': 'image', 'raw': 'image', 'svg': 'image', 'svgz': 'image',
		'tga': 'image', 'tif': 'image', 'tiff': 'image', 'wbmp': 'image', 'webp': 'image',
		'3g2': 'video', '3gp': 'video', 'asf': 'video', 'avi': 'video', 'divx': 'video',
		'flv': 'video', 'm2ts': 'video', 'm4v': 'video', 'mkv': 'video', 'mov': 'video',
		'mp4': 'video', 'mpe': 'video', 'mpeg': 'video', 'mpg': 'video', 'mts': 'video',
		'ogv': 'video', 'qt': 'video', 'rm': 'video', 'rmvb': 'video', 'vob': 'video',
		'vp9': 'video', 'webm': 'video', 'wmv': 'video',
		'aac': 'file-audio', 'ac3': 'file-audio', 'aif': 'file-audio', 'aiff': 'file-audio',
		'ape': 'file-audio', 'flac': 'file-audio', 'm3u': 'file-audio', 'm3u8': 'file-audio',
		'm4a': 'file-audio', 'mid': 'file-audio', 'midi': 'file-audio', 'mka': 'file-audio',
		'mp3': 'file-audio', 'ogg': 'file-audio', 'opus': 'file-audio', 'pls': 'file-audio',
		'ra': 'file-audio', 'tak': 'file-audio', 'vqf': 'file-audio', 'wav': 'file-audio',
		'wma': 'file-audio', 'wv': 'file-audio',
		'ass': 'note', 'doc': 'note', 'docx': 'note', 'log': 'note', 'odp': 'note',
		'odt': 'note', 'pages': 'note', 'ppt': 'note', 'pptx': 'note', 'ps': 'note',
		'rtf': 'note', 'rst': 'note', 'srt': 'note', 'txt': 'note', 'vtt': 'note',
		'markdown': 'markdown', 'md': 'markdown',
		'azw': 'book', 'azw3': 'book', 'epub': 'book', 'fb2': 'book', 'mobi': 'book',
		'eot': 'typography', 'otf': 'typography', 'ttc': 'typography', 'ttf': 'typography',
		'woff': 'typography', 'woff2': 'typography',
		'appimage': 'package', 'apk': 'package', 'crx': 'package', 'deb': 'package',
		'ear': 'package', 'gemspec': 'package', 'jar': 'package', 'jellyfin-plugin': 'package',
		'msi': 'package', 'msix': 'package', 'nupkg': 'package', 'rpm': 'package',
		'snap': 'package', 'war': 'package', 'whl': 'package', 'xpi': 'package',
		'baf': 'cache', 'baj': 'cache', 'cache-9': 'cache',
		'backup': 'history', 'bak': 'history', 'bak1': 'history', 'bak2': 'history',
		'bak3': 'history', 'old': 'history', 'orig': 'history', 'rej': 'history',
		'reload-generation': 'history', 'rev': 'history', 'viminfo': 'history',
		'bdic': 'file-binary', 'binarypb': 'file-binary', 'bin': 'file-binary',
		'class': 'file-binary', 'dat': 'file-binary', 'dll': 'file-binary',
		'dylib': 'file-binary', 'exe': 'file-binary', 'o': 'file-binary',
		'obj': 'file-binary', 'pb': 'file-binary', 'pdb': 'file-binary',
		'so': 'file-binary', 'wasm': 'file-binary',
		'cer': 'shield-lock', 'crt': 'shield-lock', 'pfx': 'shield-lock',
		'htpasswd': 'key', 'key': 'key', 'pem': 'key',
		'lnk': 'file-symlink-file', 'mblink': 'file-symlink-file',
		'url': 'link', 'webloc': 'link', 'list': 'list-unordered',
		'xbel': 'bookmark', 'tag': 'tag'
	}

	var insert = function(filename, datetime, size) {
		var emoji = ''
		if (omit_icon_if_emoji && (m = /^(\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff])(.+?)/.exec(filename))) {
			css = ''
			emoji = m[1]
		} else if (filename == '../') {
			css = 'octicon file-directory-open-fill'
		} else if (/\/$/.test(filename)) {
			css = 'octicon file-directory'
		} else {
			basename = filename.toLowerCase().replace(/\/$/, '').split('/').pop()
			css = 'octicon ' + (named_icons[basename] || icons[basename.split('.').pop()] || 'file')
		}

		displayname = decodeURIComponent(filename.replace(/\/$/, ''))
		if (emoji != '' && displayname[emoji.length] != ' ')
			displayname = emoji + ' ' + displayname.substr(emoji.length)
		if (displayname.length > max_name_length)
			displayname = displayname.substring(0, max_name_length-3) + '..>';

		if (!isNaN(Date.parse(datetime))) {
			d = new Date(datetime)
			pad = function (s) {return s < 10 ? '0' + s : s}
			mon = function (m) {return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]}
			datetime = datetime_format
					.replace('%Y', d.getFullYear())
					.replace('%m', pad(d.getMonth()+1))
					.replace('%d', pad(d.getDate()))
					.replace('%H', pad(d.getHours()))
					.replace('%M', pad(d.getMinutes()))
					.replace('%S', pad(d.getSeconds()))
					.replace('%b', mon(d.getMonth()))
		}

		rows.push('<tr><td><a class="'+css+'" href="'+escape(filename)+'">'+escape(displayname)+'</a></td><td>'+escape(datetime)+'</td><td>'+escape(size == '-' ? '' : size)+'</td></tr>')
	}

	var readme_md = ''
	var readme_js = ''
	insert('../', '', '-')
	for (var i in bodylines) {
		if (m = /\s*<a href="(.+?)">(.+?)<\/a>\s+(\S+)\s+(\S+)\s+(\S+)\s*/.exec(bodylines[i])) {
			filename = decodeURIComponent(m[1])
			datetime = m[3] + ' ' + m[4]
			size = m[5]
			switch (filename.toLowerCase()) {
			  case 'readme.md':
			    if (!readme_md)
			      head.add('link').attr('rel', 'preconnect').attr('href', 'https://cdnjs.cloudflare.com').attr('crossorigin', '')
			    readme_md = filename
			    break;
			  case 'readme.js':
			    readme_js = filename
			    break;
			}

			insert(filename, datetime, size)
		}
	}
	table.html(rows.join(''))

	document.documentElement.lang = navigator.language
	document.body.appendChild(div.element)

	if (enable_readme && readme_md !== '') {
		var readme_text = null
		var readme_style_ready = false
		var render_readme = function() {
			if (readme_text === null || !window.marked || !readme_style_ready)
				return
			text = readme_text
			begin = text.indexOf('<!--<script>')
			end = text.indexOf("\n</" + "script>-->")
			if (begin != 0) {
				readme = div.add('table').add('tbody');
				readme.add('tr').add('th').attr('colspan', '3').add('span').attr('class', 'octicon book').text(readme_md)
				readme.add('tr').add('td').attr('colspan', '3').add('div').attr('id', 'readme').attr('class', 'markdown-body').html(marked.parse(text))
			}
			if (begin < end)
				div.add('script').html(text.substr(begin+4+8, end+1-begin-4-8))
		}
		var load_readme = function() {
			xhr = new XMLHttpRequest()
			xhr.open('GET', location.pathname.replace(/[^/]+$/, '')+readme_md, true)
			xhr.onload = function() {
				if (xhr.status < 200 || xhr.status >= 300)
					return
				readme_text = xhr.responseText
				render_readme()
			}
			xhr.send()

			marked_script = div.add('script').attr('src', 'https://cdnjs.cloudflare.com/ajax/libs/marked/0.5.2/marked.min.js').attr('integrity', 'sha256-zFUosuESzULu5P+SZdjRRtBZR8+1u5RZDlbt3Q5KL8U=').attr('crossorigin', 'anonymous')
			marked_script.element.onload = render_readme
			marked_style = div.add('link').attr('rel', 'stylesheet').attr('href', 'https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown-light.min.css').attr('integrity', 'sha256-WQx0Y6LLZeGv3V3NVVge+YIL5MIOt45RPuFdkyNodls=').attr('crossorigin', 'anonymous')
			marked_style.element.onload = marked_style.element.onerror = function() {
				readme_style_ready = true
				render_readme()
			}
		}
		// README is below the listing, so keep its remote dependencies off the critical path.
		if (window.requestIdleCallback)
			requestIdleCallback(load_readme, {timeout: 500})
		else
			setTimeout(load_readme, 0)
	}
	if (enable_readme && readme_js !== '') {
		div.add('script').attr('src', readme_js)
	}
}()

function sortby(index) {
	rows = document.getElementsByClassName('table-hover')[0].rows
	link = rows[0].getElementsByTagName('a')[index]
	arrow = link.className == 'octicon arrow-down' ? 1 : -1
	link.className = 'octicon arrow-' + (arrow == 1 ? 'up' : 'down');
	[].slice.call(rows).slice(2).map(function (e, i) {
		type = e.getElementsByTagName('a')[0].className.indexOf('file-directory') >= 0 ? 0 : 1
		text = e.getElementsByTagName('td')[index].innerText
		if (index === 0) {
			value = text
		} else if (index === 1) {
			value = new Date(text).getTime()
		} else if (index === 2) {
			m = {'G':1024*1024*1024, 'M':1024*1024, 'K':1024}
			value = parseInt(text || 0) * (m[text[text.search(/[KMG]B?$/)]] || 1)
		}
		return {type: type, value: value, index: i, html: e.innerHTML}
	}).sort(function (a, b) {
		if (a.type != b.type)
			return a.type - b.type
		if (a.value != b.value)
			return a.value < b.value ? -arrow : arrow
		return a.index < b.index ? -arrow : arrow
	}).forEach(function (e, i) {
		rows[2+i].innerHTML = e.html
	})
}

<style>
:root {
	--fgColor-default: #1f2328;
	--fgColor-muted: #59636e;
	--borderColor-default: #d1d9e0;
	--bgColor-default: #ffffff;
	--bgColor-muted: #f6f8fa;
	--fgColor-accent: #0969da;
}
html {
	scrollbar-gutter: stable;
}
body {
	margin: 0;
	color: var(--fgColor-default);
	background: var(--bgColor-default);
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
	font-size: 14px;
	line-height: 1.5;
	-webkit-font-smoothing: antialiased;
}
.container {
	padding-right: 24px;
	padding-left: 24px;
	margin-right: auto;
	margin-left: auto;
}
@media (min-width: 768px) {
	.container {
		max-width: 750px;
	}
}
@media (min-width: 992px) {
	.container {
		max-width: 970px;
	}
}
@media (min-width: 1200px) {
	.container {
		max-width: 1170px;
	}
}
table {
	width: 100%;
	max-width: 100%;
	margin-bottom: 24px;
	border: 1px solid var(--borderColor-default);
	border-spacing: 0;
	border-collapse: separate;
	border-radius: 6px;
	overflow: hidden;
}
table th {
	background: var(--bgColor-muted);
	font-size: 14px;
	font-weight: 600;
}
table tr {
	background: var(--bgColor-default);
}
table th, table td {
	border: 0;
	border-bottom: 1px solid var(--borderColor-default);
	font-size: 14px;
	line-height: 20px;
	padding: 8px 12px;
	text-align: left;
	vertical-align: middle;
}
table tr:last-child > th,
table tr:last-child > td {
	border-bottom: 0;
}
a {
	color: var(--fgColor-accent);
	text-decoration: none;
}
a:hover, a:focus {
	color: var(--fgColor-accent);
	text-decoration: underline;
}
table.table-hover > tbody > tr:hover > td,
table.table-hover > tbody > tr:hover > th {
	background-color: var(--bgColor-muted);
}
table.table-hover > tbody > tr:first-child > td {
	background-color: var(--bgColor-muted);
	font-weight: 600;
}
table.table-hover > tbody > tr:first-child > td > a {
	color: var(--fgColor-muted);
}
table.table-hover > tbody > tr:not(:first-child) > td:first-child > a {
	color: var(--fgColor-default);
}
table.table-hover > tbody > tr:not(:first-child) > td:first-child > a:hover,
table.table-hover > tbody > tr:not(:first-child) > td:first-child > a:focus {
	color: var(--fgColor-accent);
}
table.table-hover > tbody > tr > td:nth-child(n+2) {
	color: var(--fgColor-muted);
	white-space: nowrap;
}
table.table-hover > tbody > tr > td:nth-child(3) {
	text-align: right;
}
.markdown-body {
	float: left;
	font-family: inherit;
}
/* octicons, see https://phus.lu/code/octicons.html */
.octicon {
	display: inline-block;
	min-height: 16px;
	padding-left: 24px;
	background-position: 0 50%;
	background-repeat: no-repeat;
	background-size: 16px 16px;
}
@media (max-width: 544px) {
	.container {
		padding-right: 16px;
		padding-left: 16px;
	}
	table th, table td {
		padding: 7px 10px;
	}
	table.table-hover {
		table-layout: fixed;
	}
	table.table-hover > tbody > tr > td:first-child {
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	table.table-hover > tbody > tr > td:nth-child(2) {
		width: 10.5em;
		font-size: 12px;
	}
	table.table-hover > tbody > tr > td:nth-child(3) {
		width: 4.5em;
		font-size: 12px;
	}
}
@media (max-width: 360px) {
	table.table-hover > tbody > tr > td:nth-child(3) {
		display: none;
	}
