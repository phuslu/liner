<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <meta name="description" content="Liner WebShell" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@wterm/dom@0.5.6/src/terminal.css" />
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            font-family: "ubuntu", "Tahoma", "Microsoft YaHei", Arial, Serif;
        }
        .webshell {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .webshell-terminal {
            flex: 1;
            min-height: 0;
        }
        #terminal {
            width: 100%;
            height: 100%;
        }
        #terminal.wterm {
            --term-bg: #101010;
            --term-fg: #d4d4d4;
            --term-cursor: #ffffff;
            --term-font-family: Menlo, Monaco, "Courier New", monospace;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
        }
        #reconnect-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            align-items: center;
            justify-content: center;
        }
        #reconnect-box {
            background: #d0d0d0;
            color: #000;
            padding: 14px 26px;
            border-radius: 12px;
            font-size: 22px;
            font-family: Menlo, Monaco, "Courier New", monospace;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>
    <div class="webshell">
        <div id="terminal" class="webshell-terminal" aria-label="Terminal"></div>
        <div id="reconnect-overlay"><div id="reconnect-box">Press ⏎ to Reconnect</div></div>
    </div>

    <!-- @wterm/dom + @wterm/ghostty 0.5.6; assets live in cdnjs.zip. -->
    <script src="https://cdn.jsdelivr.net/npm/@wterm/dom@0.5.6/dist/wterm.bundle.js"></script>
    <script>
        (function () {
            'use strict';

            var api = window.WTermBundle;
            var terminalElement = document.getElementById('terminal');
            var overlay = document.getElementById('reconnect-overlay');
            var encoder = window.TextEncoder ? new TextEncoder() : null;
            var baseTitle = {{ index .Values `title` | toJson }} || 'liner webshell';
            var windowsMode = {{ .Request.URL.Query.Get `windows_mode` | default (index .Values `windows_mode`) | toJson }} === 'true';
            var fontSize = parseInt({{ .Request.URL.Query.Get `font_size` | default (index .Values `font_size`) | toJson }}) || 14;
            var foreground = {{ index .Values `foreground` | default "#d4d4d4" | toJson }};
            var xtermPalette = [
                0x2e3436, 0xcc0000, 0x4e9a06, 0xc4a000,
                0x3465a4, 0x75507b, 0x06989a, 0xd3d7cf,
                0x555753, 0xef2929, 0x8ae234, 0xfce94f,
                0x729fcf, 0xad7fa8, 0x34e2e2, 0xeeeeec
            ];

            if (!/^#[0-9a-fA-F]{6}$/.test(foreground)) {
                foreground = '#d4d4d4';
            }

            document.title = baseTitle;
            terminalElement.style.setProperty('--term-fg', foreground);
            terminalElement.style.setProperty('--term-font-size', fontSize + 'px');

            var reconnectMode = false;
            var term = null;
            var ws = null;
            var lastWasCR = false;

            if (!api || !api.WTerm || !api.GhosttyCore || !encoder || !window.WebSocket || !window.WebAssembly) {
                terminalElement.textContent = 'Failed to initialize terminal: wterm requires a modern browser';
                return;
            }

            function convertEol(data) {
                var input = typeof data === 'string' ? encoder.encode(data) : data;
                var hasLF = false;
                var i;
                for (i = 0; i < input.length; i++) {
                    if (input[i] === 0x0a) {
                        hasLF = true;
                        break;
                    }
                }
                if (!hasLF) {
                    if (input.length) lastWasCR = input[input.length - 1] === 0x0d;
                    return input;
                }
                var output = new Uint8Array(input.length * 2);
                var length = 0;
                for (i = 0; i < input.length; i++) {
                    var byte = input[i];
                    if (byte === 0x0a && !lastWasCR) output[length++] = 0x0d;
                    output[length++] = byte;
                    lastWasCR = byte === 0x0d;
                }
                return output.subarray(0, length);
            }

            function writeOutput(data) {
                term.write(windowsMode ? convertEol(data) : data);
            }

            function showReconnectOverlay() {
                reconnectMode = true;
                overlay.style.display = 'flex';
                if (document.activeElement && document.activeElement.blur) {
                    document.activeElement.blur();
                }
                if (term) {
                    term.write('\r\n\x1b[31mSession Ended\x1b[0m\r\n');
                }
            }

            function hideReconnectOverlay() {
                reconnectMode = false;
                overlay.style.display = 'none';
                if (term) term.focus();
            }

            function sendResize() {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'resize',
                        cols: term.cols,
                        rows: term.rows
                    }));
                }
            }

            function initTerminal() {
                return api.GhosttyCore.load({
                    wasmPath: 'https://cdn.jsdelivr.net/npm/@wterm/ghostty@0.5.6/wasm/ghostty-vt.wasm',
                    foregroundColor: foreground,
                    backgroundColor: '#101010',
                    scrollbackLimit: 100000
                }).then(function (core) {
                    term = new api.WTerm(terminalElement, {
                        core: core,
                        autoResize: true,
                        cursorBlink: true,
                        onData: function (data) {
                            if (!reconnectMode && ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(encoder.encode(data));
                            }
                        },
                        onBinary: function (data) {
                            if (!reconnectMode && ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(data);
                            }
                        },
                        onResize: function () {
                            sendResize();
                        },
                        onTitle: function (title) {
                            document.title = title || baseTitle;
                        }
                    });
                    return term.init().then(function () {
                        term.setThemeColors({
                            foreground: parseInt(foreground.slice(1), 16),
                            background: 0x101010,
                            cursor: 0xffffff,
                            palette: xtermPalette
                        });
                    });
                }).then(function () {
                    var websocketURL =
                        location.protocol.replace('http', 'ws') + '//' +
                        location.host +
                        location.pathname.replace(/\/[^/]*$/, '') + '/ws';

                    ws = new WebSocket(websocketURL);
                    ws.binaryType = 'arraybuffer';

                    ws.onmessage = function (event) {
                        writeOutput(event.data instanceof ArrayBuffer ? new Uint8Array(event.data) : event.data);
                    };

                    ws.onopen = function () {
                        hideReconnectOverlay();
                        sendResize();
                    };

                    ws.onclose = function () {
                        showReconnectOverlay();
                    };

                    ws.onerror = function (event) {
                        console.error('websocket error:', event);
                    };
                });
            }

            initTerminal().then(null, function (error) {
                console.error('Failed to initialize wterm/ghostty:', error);
                terminalElement.textContent = 'Failed to initialize terminal: ' + (error && error.message ? error.message : error);
            });

            window.addEventListener('keydown', function (event) {
                if (reconnectMode && event.key === 'Enter') {
                    location.reload();
                }
            });

            window.addEventListener('beforeunload', function () {
                if (ws) ws.close();
                if (term) term.destroy();
            });
        })();
    </script>
</body>
</html>
