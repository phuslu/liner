<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <meta name="description" content="Liner WebShell" />
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            font-family: "ubuntu", "Tahoma", "Microsoft YaHei", Arial, Serif;
        }
        .webshell {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .webshell-terminal {
            flex: 1;
        }
        #terminal {
            width: 100%;
            height: 100%;
        }
        #reconnect-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            align-items: center;
            justify-content: center;
        }
        #reconnect-box {
            background: #d0d0d0;
            color: #000;
            padding: 14px 26px;
            border-radius: 12px;
            font-size: 22px;
            font-family: Menlo, Monaco, "Courier New", monospace;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>
    <div class="webshell">
        <div id="terminal" class="webshell-terminal"></div>
        <div id="reconnect-overlay"><div id="reconnect-box">Press ⏎ to Reconnect</div></div>
    </div>

    <script type="module">
        import { init, Terminal, FitAddon } from 'https://cdn.jsdelivr.net/npm/ghostty-web@0.4.0/dist/ghostty-web.js';

        document.title = "{{ index .Values `title` }}" || "liner webshell";

        const terminal = document.getElementById('terminal');
        const overlay = document.getElementById('reconnect-overlay');
        let reconnectMode = false;
        let term;
        let fitAddon;
        let ws;

        const encoder = new TextEncoder();
        let framePending = false;
        let queue = [];

        function flushQueue() {
            framePending = false;
            for (let i = 0; i < queue.length; i++) {
                term.write(queue[i]);
            }
            queue.length = 0;
        }

        function showReconnectOverlay() {
            reconnectMode = true;
            overlay.style.display = 'flex';
            term.blur();
            term.write('\r\n\x1b[31mSession Ended\x1b[0m\r\n');
        }

        function hideReconnectOverlay() {
            reconnectMode = false;
            overlay.style.display = 'none';
            term.focus();
        }

        function sendResize() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'resize',
                    cols: term.cols,
                    rows: term.rows
                }));
            }
        }

        async function initTerminal() {
            await init();

            const windowsMode = "{{ .Request.URL.Query.Get `windows_mode` | default (index .Values `windows_mode`) }}" == "true";

            term = new Terminal({
                cursorBlink: true,
                disableStdin: false,
                fontSize: parseInt("{{ .Request.URL.Query.Get `font_size` | default (index .Values `font_size`) }}") || 14,
                fontFamily: 'Menlo, Monaco, "Courier New", monospace',
                theme: { background: '#101010' },
                scrollback: 5000,
                convertEol: windowsMode,
            });

            fitAddon = new FitAddon();
            term.loadAddon(fitAddon);

            term.open(terminal);
            fitAddon.fit();
            fitAddon.observeResize();
            window.addEventListener('resize', () => fitAddon.fit());

            term.onResize(() => sendResize());

            term.onData((data) => {
                if (reconnectMode) return;
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(encoder.encode(data));
                }
            });

            ws = new WebSocket(
                location.protocol.replace('http', 'ws') + '//' +
                location.host +
                location.pathname.replace(/\/[^/]*$/, '') + '/ws'
            );
            ws.binaryType = 'arraybuffer';

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    queue.push(new Uint8Array(event.data));
                } else {
                    queue.push(event.data);
                }
                if (!framePending) {
                    framePending = true;
                    requestAnimationFrame(flushQueue);
                }
            };

            ws.onopen = () => {
                hideReconnectOverlay();
                sendResize();
            };

            ws.onclose = () => {
                showReconnectOverlay();
            };
        }

        initTerminal().catch((error) => {
            console.error('Failed to initialize ghostty-web:', error);
            terminal.textContent = 'Failed to initialize terminal: ' + (error && error.message ? error.message : error);
        });

        window.addEventListener('keydown', (e) => {
            if (reconnectMode && e.key === 'Enter') {
                location.reload();
            }
        });
    </script>
</body>
</html>
